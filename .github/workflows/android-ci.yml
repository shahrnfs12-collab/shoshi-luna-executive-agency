name: Android CI

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify wrapper permissions
        run: chmod +x gradlew tools/*.sh

      - name: Static truth gates
        run: |
          ./tools/zero_placeholder_gate.sh
          grep -RInE 'SIMULATED_OUTPUT|Executive Response to|NotImplementedException|TODO|FIXME' app/src/main/java --include='*.kt' && exit 1 || true

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload reports and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-evidence
          if-no-files-found: warn
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/outputs/apk/debug/app-debug.apk
