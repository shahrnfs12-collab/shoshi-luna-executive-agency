name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify wrapper permissions
        run: chmod +x gradlew tools/*.sh

      - name: Static truth gates
        run: |
          ./tools/zero_placeholder_gate.sh
          grep -RInE 'SIMULATED_OUTPUT|Executive Response to|NotImplementedException|TODO|FIXME' app/src/main/java --include='*.kt' && exit 1 || true

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Install Android emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd -n ci_api35 -k "system-images;android-35;google_apis;x86_64" --force

      - name: Start emulator and wait for boot
        run: |
          nohup emulator -avd ci_api35 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot-load \
            -no-snapshot-save \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          for i in $(seq 1 90); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then
              echo "EMULATOR_BOOT=PASS"
              break
            fi
            if [ "$i" = "90" ]; then
              echo "Emulator failed to boot"
              cat "$RUNNER_TEMP/emulator.log" || true
              exit 1
            fi
            sleep 2
          done
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb devices

      - name: Runtime instrumentation tests
        run: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Emulator diagnostics
        if: failure()
        run: |
          adb devices || true
          adb shell getprop sys.boot_completed || true
          cat "$RUNNER_TEMP/emulator.log" || true

      - name: Upload reports, APK and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-evidence
          if-no-files-found: warn
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
