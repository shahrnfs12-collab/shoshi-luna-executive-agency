name: Telegram Bot Health

on:
  push:
    paths:
      - '.github/workflows/telegram-health.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  telegram-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Telegram bot token and write status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo '{"bot_ok":false,"error":"missing_secret"}' > telegram_health.json
          else
            API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
            ME="$(curl -fsS "${API}/getMe")"
            WH="$(curl -fsS "${API}/getWebhookInfo")"
            ME_JSON="$ME" WH_JSON="$WH" python3 - <<'PY'
import json, os
me=json.loads(os.environ['ME_JSON'])
wh=json.loads(os.environ['WH_JSON'])
r=me.get('result',{})
w=wh.get('result',{})
out={
  'bot_ok': bool(me.get('ok')),
  'bot_username': r.get('username',''),
  'webhook_configured': bool(w.get('url')),
  'pending_update_count': w.get('pending_update_count',0)
}
open('telegram_health.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
PY
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_health.json
          git commit -m "Update Telegram health status" || exit 0
          git push
