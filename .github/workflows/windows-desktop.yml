name: Windows Desktop CI

on:
  push:
    branches: [ "shoshi-luna-windows-desktop" ]
  workflow_dispatch:

jobs:
  windows-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Unit tests
        run: ./gradlew --no-daemon :desktop:test

      - name: Build desktop distribution
        run: ./gradlew --no-daemon :desktop:installDist

      - name: Install MinGW cross compiler
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 zip

      - name: Build Windows PE launcher
        run: |
          rm -rf desktop/build/windows
          mkdir -p desktop/build/windows/ShoshiLunaDesktop/lib
          x86_64-w64-mingw32-gcc -Os -s -mwindows \
            desktop/src/launcher/windows_launcher.c \
            -o desktop/build/windows/ShoshiLunaDesktop/ShoshiLunaDesktop.exe \
            -luser32
          cp -a desktop/build/install/ShoshiLunaDesktop/lib/. desktop/build/windows/ShoshiLunaDesktop/lib/
          test -s desktop/build/windows/ShoshiLunaDesktop/ShoshiLunaDesktop.exe
          file desktop/build/windows/ShoshiLunaDesktop/ShoshiLunaDesktop.exe | grep -E 'PE32\+ executable.*x86-64'
          test -s desktop/build/windows/ShoshiLunaDesktop/lib/shoshi-luna-desktop.jar

      - name: Verify JVM distribution
        run: |
          jar tf desktop/build/windows/ShoshiLunaDesktop/lib/shoshi-luna-desktop.jar | grep 'com/shoshiluna/desktop/MainKt.class'
          jar tf desktop/build/windows/ShoshiLunaDesktop/lib/shoshi-luna-desktop.jar | grep 'com/shoshiluna/desktop/DesktopPolicies.class'

      - name: Archive portable Windows distribution
        run: |
          cd desktop/build/windows
          zip -r ../ShoshiLunaDesktop-Windows-x64.zip ShoshiLunaDesktop

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShoshiLunaDesktop-Windows-x64
          path: desktop/build/ShoshiLunaDesktop-Windows-x64.zip
          if-no-files-found: error
